# Dependabot opens update PRs against `next`. Every one auto-merges once CI passes
# (.github/workflows/dependabot-automerge.yml); the ruleset on `next` requires CI.
# server/ and producers/mock/ have no dependencies, so only app/ is watched.
version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    target-branch: next
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for all non-major bumps; each major gets its own PR.
      minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore(deps)

  - package-ecosystem: github-actions
    directory: /
    target-branch: next
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: chore(ci)
